<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>Interest Calculator</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    background:#f3f4f6;
    color:#111827;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    font-size:30px;
    margin-bottom:6px;
}

.header p{
    color:#6b7280;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input,select{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
    margin-bottom:15px;
    outline:none;
}

input:focus,select:focus{
    border-color:#2563eb;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.buttons{
    display:flex;
    gap:10px;
}

button{
    border:0;
    padding:14px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    flex:1;
}

.calculate{
    background:#2563eb;
    color:white;
}

.reset{
    background:#e5e7eb;
    color:#111827;
}

.results{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.result-box{
    background:#f9fafb;
    border-radius:12px;
    padding:15px;
}

.result-box small{
    color:#6b7280;
}

.result-box h2{
    margin-top:6px;
    font-size:20px;
}

.highlight{
    background:#eff6ff;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th,td{
    padding:11px;
    border-bottom:1px solid #e5e7eb;
    text-align:right;
    white-space:nowrap;
}

th{
    background:#f9fafb;
}

th:first-child,
td:first-child{
    text-align:center;
}

.badge{
    display:inline-block;
    background:#eef2ff;
    padding:7px 10px;
    border-radius:20px;
    font-size:13px;
    margin-bottom:10px;
}

.hidden{
    display:none;
}

.year-card{
    background:#f9fafb;
    padding:15px;
    border-radius:12px;
    margin-top:10px;
}

.year-card h3{
    margin-bottom:8px;
}

canvas{
    width:100%;
    max-height:300px;
}

@media(max-width:650px){
    body{
        padding:12px;
    }

    .header h1{
        font-size:25px;
    }

    .row,
    .results{
        grid-template-columns:1fr;
    }

    .buttons{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <h1>💰 Interest Calculator</h1>
    <p>Calculate monthly & yearly interest easily</p>
</div>

<div class="card">

    <div class="row">

        <div>
            <label>Principal Amount (₹)</label>
            <input type="number" id="principal" placeholder="Example: 50000">
        </div>

        <div>
            <label>Annual Interest Rate (%)</label>
            <input type="number" id="rate" step="0.01" placeholder="Example: 12">
        </div>

    </div>

    <div class="row">

        <div>
            <label>Total Months</label>
            <input type="number" id="months" min="1" placeholder="Example: 22">
        </div>

        <div>
            <label>Interest Type</label>
            <select id="type">
                <option value="compound">Compound Interest</option>
                <option value="simple">Simple Interest</option>
            </select>
        </div>

    </div>

    <div class="buttons">
        <button class="calculate" onclick="calculate()">Calculate</button>
        <button class="reset" onclick="resetCalculator()">Reset</button>
    </div>

</div>


<div id="resultSection" class="hidden">

<div class="card">

    <span class="badge">📊 Calculation Summary</span>

    <div class="results">

        <div class="result-box">
            <small>1 Month Interest</small>
            <h2 id="oneMonthInterest">₹0</h2>
        </div>

        <div class="result-box">
            <small>Total Interest</small>
            <h2 id="totalInterest">₹0</h2>
        </div>

        <div class="result-box highlight">
            <small>Final Amount</small>
            <h2 id="finalAmount">₹0</h2>
        </div>

    </div>

</div>


<div class="card">

    <span class="badge">📅 Month-wise Details</span>

    <div class="table-wrap">

    <table>
        <thead>
            <tr>
                <th>Month</th>
                <th>Opening Amount</th>
                <th>Interest</th>
                <th>Closing Amount</th>
            </tr>
        </thead>

        <tbody id="monthlyTable"></tbody>

    </table>

    </div>

</div>


<div class="card">

    <span class="badge">📆 Year-wise Summary</span>

    <div id="yearlySummary"></div>

</div>


<div class="card">

    <span class="badge">📈 Growth Chart</span>

    <canvas id="chart"></canvas>

</div>

</div>

</div>


<script>

let chartCanvas = document.getElementById("chart");

function money(value){
    return "₹" + value.toLocaleString("en-IN",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
    });
}

function calculate(){

    const principal = parseFloat(document.getElementById("principal").value);
    const rate = parseFloat(document.getElementById("rate").value);
    const months = parseInt(document.getElementById("months").value);
    const type = document.getElementById("type").value;

    if(!principal || !rate || !months || principal <= 0 || rate < 0 || months <= 0){
        alert("Please enter valid values.");
        return;
    }

    const monthlyRate = rate / 100 / 12;

    let amount = principal;
    let totalInterest = 0;

    let tableHTML = "";

    let yearData = {};
    let chartData = [principal];

    let simpleMonthlyInterest = principal * monthlyRate;

    for(let month=1; month<=months; month++){

        let openingAmount = amount;
        let interest;

        if(type === "compound"){

            interest = amount * monthlyRate;
            amount += interest;

        }else{

            interest = simpleMonthlyInterest;
            amount = principal + (simpleMonthlyInterest * month);

        }

        totalInterest += interest;

        tableHTML += `
        <tr>
            <td>${month}</td>
            <td>${money(openingAmount)}</td>
            <td>${money(interest)}</td>
            <td>${money(amount)}</td>
        </tr>
        `;

        chartData.push(amount);

        let year = Math.ceil(month / 12);

        if(!yearData[year]){
            yearData[year] = {
                start: openingAmount,
                interest: 0,
                end: amount,
                months: 0
            };
        }

        yearData[year].interest += interest;
        yearData[year].end = amount;
        yearData[year].months++;
    }

    document.getElementById("monthlyTable").innerHTML = tableHTML;

    document.getElementById("oneMonthInterest").innerText =
        money(simpleMonthlyInterest);

    document.getElementById("totalInterest").innerText =
        money(totalInterest);

    document.getElementById("finalAmount").innerText =
        money(amount);

    let yearlyHTML = "";

    Object.keys(yearData).forEach(year => {

        const data = yearData[year];

        yearlyHTML += `
        <div class="year-card">
            <h3>Year ${year}</h3>
            <p>Months: ${data.months}</p>
            <p>Interest Earned: <b>${money(data.interest)}</b></p>
            <p>End Amount: <b>${money(data.end)}</b></p>
        </div>
        `;

    });

    document.getElementById("yearlySummary").innerHTML = yearlyHTML;

    document.getElementById("resultSection").classList.remove("hidden");

    drawChart(chartData);

    document.getElementById("resultSection").scrollIntoView({
        behavior:"smooth"
    });
}


function drawChart(data){

    const ctx = chartCanvas.getContext("2d");

    const width = chartCanvas.width =
        chartCanvas.clientWidth * window.devicePixelRatio;

    const height = chartCanvas.height =
        280 * window.devicePixelRatio;

    ctx.clearRect(0,0,width,height);

    const max = Math.max(...data);

    ctx.beginPath();

    data.forEach((value,index)=>{

        const x = (index/(data.length-1 || 1)) * width;

        const y = height - (value/max * (height-30));

        if(index===0){
            ctx.moveTo(x,y);
        }else{
            ctx.lineTo(x,y);
        }

    });

    ctx.strokeStyle = "#2563eb";
    ctx.lineWidth = 3 * window.devicePixelRatio;
    ctx.stroke();

}


function resetCalculator(){

    document.getElementById("principal").value = "";
    document.getElementById("rate").value = "";
    document.getElementById("months").value = "";

    document.getElementById("resultSection").classList.add("hidden");

    document.getElementById("monthlyTable").innerHTML = "";
    document.getElementById("yearlySummary").innerHTML = "";

}

</script>

</body>
</html>
