<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interest Calculator</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

h1 {
  text-align: center;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin-top: 6px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 20px;
  background: #1976d2;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 17px;
}

.result {
  margin-top: 20px;
}

.card {
  background: #f7f7f7;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

th, td {
  border: 1px solid #ddd;
  padding: 8px;
  text-align: center;
}

th {
  background: #eee;
}
</style>
</head>

<body>

<div class="container">

<h1>Interest Calculator</h1>

<label>Principal Amount (₹)</label>
<input type="number" id="principal" placeholder="Example: 5000">

<label>Monthly Interest (%)</label>
<input type="number" id="rate" placeholder="Example: 3">

<label>Total Months</label>
<input type="number" id="months" placeholder="Example: 24">

<button onclick="calculate()">Calculate</button>

<div id="result" class="result"></div>

</div>

<script>

function calculate() {

  let principal = parseFloat(document.getElementById("principal").value);
  let rate = parseFloat(document.getElementById("rate").value);
  let totalMonths = parseInt(document.getElementById("months").value);

  if (!principal || !rate || !totalMonths) {
    alert("Please enter all details");
    return;
  }

  let currentPrincipal = principal;
  let totalInterest = 0;
  let remainingMonths = totalMonths;
  let year = 1;

  let monthlyInterestFirst =
      currentPrincipal * rate / 100;

  let html = `
    <div class="card">
      <b>1 Month Interest:</b>
      ₹${monthlyInterestFirst.toFixed(2)}
    </div>

    <table>
      <tr>
        <th>Year</th>
        <th>Months</th>
        <th>Interest</th>
        <th>Closing Amount</th>
      </tr>
  `;

  while (remainingMonths > 0) {

    let monthsThisYear = Math.min(12, remainingMonths);

    let monthlyInterest =
        currentPrincipal * rate / 100;

    let yearInterest =
        monthlyInterest * monthsThisYear;

    let closingAmount =
        currentPrincipal + yearInterest;

    totalInterest += yearInterest;

    html += `
      <tr>
        <td>${year}</td>
        <td>${monthsThisYear}</td>
        <td>₹${yearInterest.toFixed(2)}</td>
        <td>₹${closingAmount.toFixed(2)}</td>
      </tr>
    `;

    currentPrincipal = closingAmount;
    remainingMonths -= monthsThisYear;
    year++;
  }

  html += `</table>`;

  html += `
    <div class="card">
      <b>Total Interest:</b>
      ₹${totalInterest.toFixed(2)}
    </div>

    <div class="card">
      <b>Final Amount:</b>
      ₹${currentPrincipal.toFixed(2)}
    </div>
  `;

  document.getElementById("result").innerHTML = html;
}

</script>

</body>
</html>
