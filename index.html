<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Udhaar & Interest Manager</title>
<meta name="theme-color" content="#172554">
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f8fafc 50%, #e0f2fe);
    color: #172033;
    min-height: 100vh;
    padding: 20px 12px 40px;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

.header {
    background: linear-gradient(135deg, #172554, #1e3a8a);
    color: white;
    padding: 22px 20px;
    border-radius: 20px;
    text-align: center;
    margin-bottom: 18px;
    box-shadow: 0 12px 30px rgba(23,37,84,.20);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h1 {
    font-size: 22px;
    margin-bottom: 4px;
}

.header p {
    font-size: 13px;
    opacity: .88;
}

.back-btn {
    background: rgba(255,255,255,0.2);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
}

.card {
    background: rgba(255,255,255,.96);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 8px 25px rgba(15,23,42,.08);
    border: 1px solid #e5e7eb;
}

.section-title {
    font-size: 18px;
    font-weight: 700;
    color: #172554;
    margin-bottom: 15px;
}

.input-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.field {
    margin-bottom: 10px;
}

.field.full-width {
    grid-column: 1 / -1;
}

.field label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
    color: #475569;
}

.input-wrap input, .input-wrap select {
    width: 100%;
    padding: 12px;
    border: 1.5px solid #cbd5e1;
    border-radius: 11px;
    outline: none;
    font-size: 15px;
    background: #f8fafc;
}

.input-wrap input:focus, .input-wrap select:focus {
    border-color: #2563eb;
    background: white;
    box-shadow: 0 0 0 3px rgba(37,99,235,.10);
}

.buttons {
    display: flex;
    gap: 12px;
    margin-top: 10px;
}

button {
    border: none;
    padding: 12px 16px;
    border-radius: 11px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

.submit-btn {
    background: #166534;
    color: white;
    flex: 1;
}

.reset-btn {
    background: #e2e8f0;
    color: #334155;
}

.client-list, .loan-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.client-card, .loan-card {
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 14px;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.client-info h4, .loan-info h4 {
    font-size: 16px;
    color: #172554;
    margin-bottom: 4px;
}

.client-info p, .loan-info p {
    font-size: 13px;
    color: #64748b;
    margin-bottom: 2px;
}

.client-actions, .loan-actions {
    display: flex;
    gap: 8px;
}

.action-btn {
    padding: 8px 12px;
    font-size: 13px;
    border-radius: 8px;
    background: #2563eb;
    color: white;
}

.calc-btn {
    background: #0284c7;
    color: white;
}

.delete-btn {
    background: #dc2626;
    color: white;
}

.empty-message {
    text-align: center;
    color: #94a3b8;
    padding: 20px;
}

/* Modal Popup */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.6);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 999;
}

.modal {
    background: white;
    width: 100%;
    max-width: 420px;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
}

.modal h3 {
    margin-bottom: 15px;
    color: #172554;
    font-size: 18px;
}

.result-box {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 14px;
    margin-top: 15px;
    font-size: 14px;
    color: #334155;
    line-height: 1.6;
}

.result-box span {
    font-weight: bold;
    color: #166534;
}

.footer {
    text-align: center;
    color: #64748b;
    font-size: 12px;
    margin-top: 20px;
}

@media (max-width: 700px) {
    .input-grid {
        grid-template-columns: 1fr;
    }
    .client-card, .loan-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }
    .client-actions, .loan-actions {
        width: 100%;
        justify-content: flex-end;
    }
}
</style>
</head>
<body>

<div class="container" id="appContainer">
    <!-- Dynamic Content -->
</div>

<!-- Calculator Modal -->
<div class="modal-overlay" id="calcModal">
    <div class="modal">
        <h3>📊 Interest Calculator</h3>
        <div class="field">
            <label>Select Interest Type</label>
            <div class="input-wrap">
                <select id="modalInterestType">
                    <option value="simple">Simple Interest (साधा ब्याज)</option>
                    <option value="compound">Compound Interest (चक्रवृद्धि ब्याज)</option>
                </select>
            </div>
        </div>
        <div class="buttons" style="margin-top: 15px;">
            <button class="submit-btn" onclick="runCalculation()">Calculate Now</button>
            <button class="reset-btn" onclick="closeModal()">Close</button>
        </div>
        <div id="modalResultArea"></div>
    </div>
</div>

<script>
let clients = JSON.parse(localStorage.getItem("udhaar_clients")) || [];
let currentView = "home"; // "home" or "ledger"
let activeClientId = null;
let activeLoanId = null;

function saveToStorage() {
    localStorage.setItem("udhaar_clients", JSON.stringify(clients));
}

function render() {
    const container = document.getElementById("appContainer");
    
    if (currentView === "home") {
        container.innerHTML = `
            <div class="header">
                <div>
                    <h1>Udhaar & Interest Manager</h1>
                    <p>Track clients & calculate live interest</p>
                </div>
            </div>

            <div class="card">
                <div class="section-title">👤 Add New Client</div>
                <div class="input-grid">
                    <div class="field">
                        <label>Client Name</label>
                        <div class="input-wrap"><input type="text" id="clientName" placeholder="Full name"></div>
                    </div>
                    <div class="field">
                        <label>Phone Number</label>
                        <div class="input-wrap"><input type="tel" id="clientPhone" placeholder="Mobile number"></div>
                    </div>
                    <div class="field full-width">
                        <label>Address</label>
                        <div class="input-wrap"><input type="text" id="clientAddress" placeholder="Address"></div>
                    </div>
                    <div class="field">
                        <label>Nominee Name</label>
                        <div class="input-wrap"><input type="text" id="nomineeName" placeholder="Nominee name"></div>
                    </div>
                    <div class="field">
                        <label>Nominee Phone</label>
                        <div class="input-wrap"><input type="tel" id="nomineePhone" placeholder="Nominee phone"></div>
                    </div>
                </div>
                <div class="buttons">
                    <button class="submit-btn" onclick="saveClient()">Save Client</button>
                </div>
            </div>

            <div class="card">
                <div class="section-title">📋 Clients List</div>
                <div id="clientListContainer" class="client-list"></div>
            </div>

            <div class="footer">Udhaar Manager App</div>
        `;
        renderClientsList();
    } else if (currentView === "ledger") {
        const client = clients.find(c => c.id === activeClientId);
        if (!client) { currentView = "home"; render(); return; }

        container.innerHTML = `
            <div class="header">
                <div>
                    <h1>${client.name}'s Ledger</h1>
                    <p>Ph: ${client.phone} | Nominee: ${client.nomineeName}</p>
                </div>
                <button class="back-btn" onclick="currentView='home'; render();">⬅ Back</button>
            </div>

            <div class="card">
                <div class="section-title">➕ Give New Udhaar / Loan</div>
                <div class="input-grid">
                    <div class="field">
                        <label>Principal Amount (₹)</label>
                        <div class="input-wrap"><input type="number" id="loanAmount" placeholder="10000"></div>
                    </div>
                    <div class="field">
                        <label>Monthly Interest Rate (%)</label>
                        <div class="input-wrap"><input type="number" id="loanRate" placeholder="3" step="0.1"></div>
                    </div>
                    <div class="field">
                        <label>Date Given</label>
                        <div class="input-wrap"><input type="date" id="loanDate"></div>
                    </div>
                    <div class="field">
                        <label>Note / Remarks</label>
                        <div class="input-wrap"><input type="text" id="loanNote" placeholder="e.g., Cash given"></div>
                    </div>
                </div>
                <div class="buttons">
                    <button class="submit-btn" onclick="addLoan()">Add Loan Entry</button>
                </div>
            </div>

            <div class="card">
                <div class="section-title">📊 Loan Entries & Calculation</div>
                <div id="loanListContainer" class="loan-list"></div>
            </div>

            <div class="footer">Udhaar Manager App</div>
        `;
        document.getElementById("loanDate").valueAsDate = new Date();
        renderLoansList();
    }
}

function saveClient() {
    const name = document.getElementById("clientName").value.trim();
    const phone = document.getElementById("clientPhone").value.trim();
    const address = document.getElementById("clientAddress").value.trim();
    const nomineeName = document.getElementById("nomineeName").value.trim();
    const nomineePhone = document.getElementById("nomineePhone").value.trim();

    if (!name || !phone) {
        alert("Please enter Name and Phone Number.");
        return;
    }

    clients.push({
        id: Date.now(),
        name, phone, address: address || "N/A",
        nomineeName: nomineeName || "N/A",
        nomineePhone: nomineePhone || "N/A",
        loans: []
    });
    saveToStorage();
    render();
}

function deleteClient(id) {
    if (confirm("Delete this client and all their records?")) {
        clients = clients.filter(c => c.id !== id);
        saveToStorage();
        render();
    }
}

function openLedger(id) {
    activeClientId = id;
    currentView = "ledger";
    render();
}

function renderClientsList() {
    const container = document.getElementById("clientListContainer");
    if (clients.length === 0) {
        container.innerHTML = `<div class="empty-message">No clients added yet.</div>`;
        return;
    }
    let html = "";
    clients.forEach(c => {
        let totalLoanCount = c.loans.length;
        html += `
            <div class="client-card">
                <div class="client-info">
                    <h4>${c.name} (${c.phone})</h4>
                    <p><strong>Address:</strong> ${c.address} | <strong>Total Loans:</strong> ${totalLoanCount}</p>
                </div>
                <div class="client-actions">
                    <button class="action-btn" onclick="openLedger(${c.id})">Open Ledger</button>
                    <button class="action-btn delete-btn" onclick="deleteClient(${c.id})">Delete</button>
                </div>
            </div>
        `;
    });
    container.innerHTML = html;
}

function addLoan() {
    const amount = Number(document.getElementById("loanAmount").value);
    const rate = Number(document.getElementById("loanRate").value);
    const date = document.getElementById("loanDate").value;
    const note = document.getElementById("loanNote").value.trim();

    if (!amount || !rate || !date) {
        alert("Please fill Amount, Rate, and Date.");
        return;
    }

    const client = clients.find(c => c.id === activeClientId);
    client.loans.push({
        id: Date.now(),
        amount, rate, date, note: note || "Loan"
    });
    saveToStorage();
    render();
}

function deleteLoan(loanId) {
    if (confirm("Delete this loan entry?")) {
        const client = clients.find(c => c.id === activeClientId);
        client.loans = client.loans.filter(l => l.id !== loanId);
        saveToStorage();
        render();
    }
}

function renderLoansList() {
    const client = clients.find(c => c.id === activeClientId);
    const container = document.getElementById("loanListContainer");
    
    if (client.loans.length === 0) {
        container.innerHTML = `<div class="empty-message">No loans given yet.</div>`;
        return;
    }

    let html = "";
    client.loans.forEach((loan, index) => {
        html += `
            <div class="loan-card">
                <div class="loan-info">
                    <h4>#${index + 1} - ₹${loan.amount.toLocaleString("en-IN")} (${loan.rate}% Monthly)</h4>
                    <p><strong>Date Given:</strong> ${loan.date} | <strong>Note:</strong> ${loan.note}</p>
                </div>
                <div class="loan-actions">
                    <button class="action-btn calc-btn" onclick="openCalcModal(${loan.id})">Calculate</button>
                    <button class="action-btn delete-btn" onclick="deleteLoan(${loan.id})">Delete</button>
                </div>
            </div>
        `;
    });
    container.innerHTML = html;
}

function openCalcModal(loanId) {
    activeLoanId = loanId;
    document.getElementById("modalResultArea").innerHTML = "";
    document.getElementById("calcModal").style.display = "flex";
}

function closeModal() {
    document.getElementById("calcModal").style.display = "none";
}

function runCalculation() {
    const client = clients.find(c => c.id === activeClientId);
    const loan = client.loans.find(l => l.id === activeLoanId);
    const type = document.getElementById("modalInterestType").value;

    const startDate = new Date(loan.date);
    const currentDate = new Date();

    if (startDate > currentDate) {
        alert("Loan date cannot be in the future!");
        return;
    }

    let diffYears = currentDate.getFullYear() - startDate.getFullYear();
    let diffMonths = currentDate.getMonth() - startDate.getMonth();
    let diffDays = currentDate.getDate() - startDate.getDate();

    let totalMonthsElapsed = (diffYears * 12) + diffMonths;
    if (diffDays < 0) {
        totalMonthsElapsed -= 1;
        const prevMonth = new Date(currentDate.getFullYear(), currentDate.getMonth(), 0);
        diffDays += prevMonth.getDate();
    }

    const exactMonths = totalMonthsElapsed + (diffDays / 30);

    let interest = 0;
    let finalAmount = 0;

    if (type === "simple") {
        interest = loan.amount * (loan.rate / 100) * exactMonths;
        finalAmount = loan.amount + interest;
    } else {
        finalAmount = loan.amount * Math.pow((1 + loan.rate / 100), exactMonths);
        interest = finalAmount - loan.amount;
    }

    document.getElementById("modalResultArea").innerHTML = `
        <div class="result-box">
            <p><strong>Time Elapsed:</strong> ${totalMonthsElapsed} Months & ${diffDays} Days</p>
            <p><strong>Principal Amount:</strong> ₹${loan.amount.toLocaleString("en-IN")}</p>
            <p><strong>Total Interest:</strong> <span>₹${Math.round(interest).toLocaleString("en-IN")}</span></p>
            <p><strong>Final Payable Amount:</strong> <span style="font-size: 16px;">₹${Math.round(finalAmount).toLocaleString("en-IN")}</span></p>
        </div>
    `;
}

render();
</script>

</body>
</html>
