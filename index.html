<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Study Checkpoints & Daily Planner</title>
  <style>
    /* Themes */
    [data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --danger: #ef4444;
      --banner-bg: #1e293b;
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #cbd5e1;
      --success: #16a34a;
      --danger: #dc2626;
      --banner-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 30px;
    }

    header {
      background-color: var(--card-bg);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-title h1 {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .header-title p {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
    }

    .container {
      padding: 16px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .date-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    label {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    input[type="date"], input[type="time"], input[type="text"] {
      background-color: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      width: 100%;
    }

    input[type="date"]:focus, input[type="time"]:focus, input[type="text"]:focus {
      border-color: var(--accent);
    }

    .quick-date-btns {
      display: flex;
      gap: 6px;
    }

    .btn-quick {
      flex: 1;
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      text-align: center;
    }

    .reminder-setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-color);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .task-input-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .task-input-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--bg-color);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .task-input-row {
      display: flex;
      gap: 8px;
    }

    .task-time-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .task-time-row input[type="time"] {
      width: 110px;
      padding: 4px 6px;
      font-size: 0.75rem;
    }

    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }

    .btn:active {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px;
    }

    /* Checklist Section */
    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
      margin: 20px 0 10px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .date-group {
      margin-bottom: 16px;
    }

    .date-header {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .task-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .task-card.completed {
      opacity: 0.5;
    }

    .task-card.completed .task-text {
      text-decoration: line-through;
    }

    .checkbox {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .task-info {
      flex: 1;
    }

    .task-text {
      font-size: 0.9rem;
    }

    .task-time-tag {
      font-size: 0.7rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* Non-Distracting Bottom Toast Banner */
    .toast-banner {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      max-width: 560px;
      margin: 0 auto;
      background-color: var(--banner-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      z-index: 100;
      display: none;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .toast-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .toast-title {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--accent);
    }

    .toast-body {
      font-size: 0.82rem;
      color: var(--text-main);
      line-height: 1.4;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-sub);
      padding: 10px;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>Study Checkpoints</h1>
      <p>Precision Daily Planner</p>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="notifBtn" onclick="requestNotificationPermission()" title="Enable Notifications">🔔</button>
      <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Switch Theme">☀️</button>
    </div>
  </header>

  <!-- Non-Distracting Bottom Toast Banner -->
  <div class="toast-banner" id="toastBanner">
    <div class="toast-header">
      <span class="toast-title" id="toastTitle">Daily Update</span>
      <button class="btn-icon" style="font-size:0.9rem;" onclick="closeToast()">✕</button>
    </div>
    <div class="toast-body" id="toastMessage">Loading message...</div>
  </div>

  <div class="container">
    
    <!-- ADD CHECKLIST -->
    <div class="card">
      <div class="card-title">Add Checkpoint / Task</div>

      <div class="date-row">
        <label>Target Date:</label>
        <input type="date" id="targetDate">
        <div class="quick-date-btns">
          <button class="btn-quick" onclick="setQuickDate(0)">Today</button>
          <button class="btn-quick" onclick="setQuickDate(1)">+1 Day</button>
          <button class="btn-quick" onclick="setQuickDate(2)">+2 Days</button>
          <button class="btn-quick" onclick="setQuickDate(7)">+7 Days</button>
        </div>
      </div>

      <div class="reminder-setting">
        <label for="globalTime">Default Reminder Time:</label>
        <input type="time" id="globalTime" value="10:30">
      </div>

      <div class="task-input-list" id="taskInputContainer">
        <!-- Dynamic task inputs injected here -->
      </div>

      <div style="display: flex; gap: 8px;">
        <button class="btn btn-secondary" onclick="addTaskInputRow()">+ Add Line</button>
        <button class="btn" onclick="saveChecklist()">Save Checklist</button>
      </div>
    </div>

    <!-- VIEW CHECKLISTS -->
    <div class="section-title">Your Checkpoints</div>
    <div id="checklistsContainer">
      <!-- Saved checklists rendered here -->
    </div>

  </div>

  <footer>
    Concept by Rajesh
  </footer>

  <script>
    let taskCount = 0;

    document.addEventListener("DOMContentLoaded", () => {
      initTheme();
      setQuickDate(0);
      addTaskInputRow();
      loadChecklists();
      checkAppOpenBehavior();
      initNotificationChecker();
    });

    // Theme Management
    function initTheme() {
      const savedTheme = localStorage.getItem('study_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeIcon(savedTheme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('study_theme', next);
      updateThemeIcon(next);
    }

    function updateThemeIcon(theme) {
      document.getElementById('themeBtn').innerText = theme === 'dark' ? '☀️' : '🌙';
    }

    // Quick Date Picker
    function setQuickDate(daysToAdd) {
      const d = new Date();
      d.setDate(d.getDate() + daysToAdd);
      document.getElementById('targetDate').value = d.toISOString().split('T')[0];
    }

    // Dynamic Input Rows
    function addTaskInputRow() {
      taskCount++;
      const container = document.getElementById('taskInputContainer');
      const row = document.createElement('div');
      row.className = 'task-input-item';
      row.id = `task-row-${taskCount}`;
      row.innerHTML = `
        <div class="task-input-row">
          <input type="text" class="task-input-text" placeholder="Enter task (e.g., Complete Chapter 2)...">
          <button class="btn-icon" onclick="removeTaskInputRow(${taskCount})">✕</button>
        </div>
        <div class="task-time-row">
          <span>Custom Time (Optional):</span>
          <input type="time" class="task-input-time">
        </div>
      `;
      container.appendChild(row);
    }

    function removeTaskInputRow(id) {
      const container = document.getElementById('taskInputContainer');
      if (container.children.length > 1) {
        const row = document.getElementById(`task-row-${id}`);
        if (row) row.remove();
      }
    }

    // Save Checklist
    function saveChecklist() {
      const dateVal = document.getElementById('targetDate').value;
      const globalTimeVal = document.getElementById('globalTime').value || '10:30';
      const items = document.querySelectorAll('.task-input-item');

      if (!dateVal) { alert("Please select a date."); return; }

      let newTasks = [];
      items.forEach(item => {
        const text = item.querySelector('.task-input-text').value.trim();
        const customTime = item.querySelector('.task-input-time').value;
        if (text !== '') {
          newTasks.push({
            id: Date.now() + Math.random(),
            text: text,
            time: customTime ? customTime : globalTimeVal,
            completed: false
          });
        }
      });

      if (newTasks.length === 0) { alert("Please enter at least one task."); return; }

      let store = JSON.parse(localStorage.getItem('study_checkpoints')) || {};
      if (!store[dateVal]) store[dateVal] = [];
      store[dateVal] = store[dateVal].concat(newTasks);
      localStorage.setItem('study_checkpoints', JSON.stringify(store));

      document.getElementById('taskInputContainer').innerHTML = '';
      taskCount = 0;
      addTaskInputRow();
      loadChecklists();
      showToast("Success", "Checklist saved successfully!");
    }

    // Render Checklists
    function loadChecklists() {
      const container = document.getElementById('checklistsContainer');
      const store = JSON.parse(localStorage.getItem('study_checkpoints')) || {};
      const dates = Object.keys(store).sort();

      if (dates.length === 0) {
        container.innerHTML = `<div class="card" style="text-align:center; color:var(--text-sub);">No checkpoints found. Add one above!</div>`;
        return;
      }

      container.innerHTML = '';
      dates.forEach(date => {
        const group = document.createElement('div');
        group.className = 'date-group';

        const header = document.createElement('div');
        header.className = 'date-header';
        header.innerHTML = `<span>📅 ${formatDisplayDate(date)}</span> <button class="btn-icon" style="font-size:0.75rem;" onclick="deleteDateGroup('${date}')">Delete Day</button>`;
        group.appendChild(header);

        store[date].forEach(t => {
          const card = document.createElement('div');
          card.className = `task-card ${t.completed ? 'completed' : ''}`;
          card.innerHTML = `
            <input type="checkbox" class="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask('${date}', ${t.id})">
            <div class="task-info">
              <div class="task-text">${escapeHtml(t.text)}</div>
              <div class="task-time-tag">⏰ ${t.time}</div>
            </div>
            <button class="btn-icon" onclick="deleteTask('${date}', ${t.id})">✕</button>
          `;
          group.appendChild(card);
        });
        container.appendChild(group);
      });
    }

    function toggleTask(date, id) {
      let store = JSON.parse(localStorage.getItem('study_checkpoints')) || {};
      if (store[date]) {
        store[date] = store[date].map(t => { if (t.id === id) t.completed = !t.completed; return t; });
        localStorage.setItem('study_checkpoints', JSON.stringify(store));
        loadChecklists();
      }
    }

    function deleteTask(date, id) {
      let store = JSON.parse(localStorage.getItem('study_checkpoints')) || {};
      if (store[date]) {
        store[date] = store[date].filter(t => t.id !== id);
        if (store[date].length === 0) delete store[date];
        localStorage.setItem('study_checkpoints', JSON.stringify(store));
        loadChecklists();
      }
    }

    function deleteDateGroup(date) {
      if (confirm(`Delete all for ${date}?`)) {
        let store = JSON.parse(localStorage.getItem('study_checkpoints')) || {};
        delete store[date];
        localStorage.setItem('study_checkpoints', JSON.stringify(store));
        loadChecklists();
      }
    }

    // Smart Open Behavior (Toast Notifications based on count/time)
    function checkAppOpenBehavior() {
      const todayStr = new Date().toISOString().split('T')[0];
      const store = JSON.parse(localStorage.getItem('study_checkpoints')) || {};
      const todayTasks = store[todayStr] || [];
      const pendingCount = todayTasks.filter(t => !t.completed).length;
      const totalCount = todayTasks.length;

      let openData = JSON.parse(localStorage.getItem('app_open_tracker')) || { date: todayStr, count: 0 };
      if (openData.date !== todayStr) {
        openData = { date: todayStr, count: 0 };
      }
      openData.count++;
      localStorage.setItem('app_open_tracker', JSON.stringify(openData));

      const hour = new Date().getHours();
      let title = "Daily Checklist";
      let msg = "";

      if (totalCount > 0 && pendingCount === 0) {
        title = "🎉 Amazing Job!";
        msg = "You have crushed all your goals for today! Keep up the brilliant momentum.";
      } else if (openData.count === 1 && hour < 12) {
        title = "🌅 Good Morning!";
        msg = `Here is your checklist for today. You have ${pendingCount} pending task(s). Consistency is key!`;
      } else if (openData.count >= 5 || hour >= 18) {
        if (pendingCount > 0) {
          title = "⚠️ Pending Tasks Warning";
          msg = `Your checklist still has ${pendingCount} task(s) pending. Let's finish them up before the day ends!`;
        } else {
          title = "🌟 Great Progress!";
          msg = "All tasks are up to date. Stay focused and keep shining!";
        }
      } else {
        title = "🎯 Study Checkpoint Reminder";
        msg = `You have ${pendingCount} pending task(s) scheduled for today. Stay locked in!`;
      }

      setTimeout(() => { showToast(title, msg); }, 600);
    }

    function showToast(title, msg) {
      document.getElementById('toastTitle').innerText = title;
      document.getElementById('toastMessage').innerText = msg;
      const banner = document.getElementById('toastBanner');
      banner.style.display = 'block';
    }

    function closeToast() {
      document.getElementById('toastBanner').style.display = 'none';
    }

    // Notifications API
    function requestNotificationPermission() {
      if (!("Notification" in window)) {
        alert("This browser does not support desktop notifications.");
        return;
      }
      Notification.requestPermission().then(permission => {
        if (permission === "granted") {
          alert("Notifications enabled successfully!");
          document.getElementById('notifBtn').style.color = "var(--success)";
        } else {
          alert("Notification permission denied.");
        }
      });
    }

    function initNotificationChecker() {
      setInterval(() => {
        const todayStr = new Date().toISOString().split('T')[0];
        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        let store = JSON.parse(localStorage.getItem('study_checkpoints')) || {};
        if (store[todayStr]) {
          store[todayStr].forEach(t => {
            if (!t.completed && t.time === timeStr && !t.notified) {
              triggerSystemNotification(t.text);
              t.notified = true;
              localStorage.setItem('study_checkpoints', JSON.stringify(store));
            }
          });
        }
      }, 30000);
    }

    function triggerSystemNotification(taskText) {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("Study Checkpoint Reminder", {
          body: `Time for your task: ${taskText}`,
          icon: "https://cdn-icons-png.flaticon.com/512/3209/3209265.png"
        });
      }
    }

    function formatDisplayDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }
  </script>
</body>
</html>
