<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Study Checkpoint & Daily Planner</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 20px;
    }

    header {
      background-color: var(--card-bg);
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    header p {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .container {
      padding: 16px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Date Selector & Quick Buttons */
    .date-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    input[type="date"], input[type="time"], input[type="text"] {
      background-color: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      width: 100%;
    }

    input[type="date"]:focus, input[type="time"]:focus, input[type="text"]:focus {
      border-color: var(--accent);
    }

    .quick-date-btns {
      display: flex;
      gap: 8px;
    }

    .btn-quick {
      flex: 1;
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: center;
    }

    .btn-quick:active {
      background: var(--border);
    }

    /* Checkbox / Toggle options */
    .reminder-setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-color);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .reminder-setting label {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    /* Task Dynamic Inputs */
    .task-input-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .task-input-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--bg-color);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .task-input-row {
      display: flex;
      gap: 8px;
    }

    .task-time-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .task-time-row input[type="time"] {
      width: 120px;
      padding: 4px 8px;
      font-size: 0.8rem;
    }

    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    /* Checklist View */
    .checklist-section-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .date-group {
      margin-bottom: 16px;
    }

    .date-header {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .task-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .task-card.completed {
      opacity: 0.5;
    }

    .task-card.completed .task-text {
      text-decoration: line-through;
    }

    .checkbox {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .task-info {
      flex: 1;
    }

    .task-text {
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .task-time-tag {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .empty-state {
      text-align: center;
      padding: 24px;
      color: var(--text-sub);
      font-size: 0.9rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-sub);
      padding: 16px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Study Checkpoints</h1>
    <p>Daily Planner & Precision Reminders</p>
  </header>

  <div class="container">
    
    <!-- ADD CHECKLIST CARD -->
    <div class="card">
      <div class="card-title">
        <span>Add Checklist / Milestone</span>
      </div>

      <!-- Date Selection -->
      <div class="date-row">
        <label style="font-size: 0.85rem; color: var(--text-sub);">Target Date:</label>
        <input type="date" id="targetDate">
        <div class="quick-date-btns">
          <button class="btn-quick" onclick="setQuickDate(0)">Today</button>
          <button class="btn-quick" onclick="setQuickDate(1)">+1 Day</button>
          <button class="btn-quick" onclick="setQuickDate(2)">+2 Days</button>
          <button class="btn-quick" onclick="setQuickDate(7)">+7 Days</button>
        </div>
      </div>

      <!-- Global Reminder for the Date -->
      <div class="reminder-setting">
        <label for="globalTime">Daily Reminder Time for this Date:</label>
        <input type="time" id="globalTime" value="10:30">
      </div>

      <!-- Dynamic Task Inputs -->
      <div class="task-input-list" id="taskInputContainer">
        <!-- Input rows injected via Javascript -->
      </div>

      <div style="display: flex; gap: 10px;">
        <button class="btn btn-secondary" onclick="addTaskInputRow()">+ Add Task Line</button>
        <button class="btn" onclick="saveChecklist()">Done & Save</button>
      </div>
    </div>

    <!-- VIEW CHECKLISTS -->
    <div class="checklist-section-title">Upcoming & Daily Checkpoints</div>
    <div id="checklistsContainer">
      <!-- Saved checklists will be displayed here -->
    </div>

  </div>

  <footer>
    Concept by Rajesh • Study Checkpoint App
  </footer>

  <script>
    let taskCount = 0;

    // Request notification permission on load
    document.addEventListener("DOMContentLoaded", () => {
      setQuickDate(0);
      addTaskInputRow();
      loadChecklists();
      requestNotificationPermission();
      checkDailyReminders();
    });

    function setQuickDate(daysToAdd) {
      const today = new Date();
      today.setDate(today.getDate() + daysToAdd);
      const formattedDate = today.toISOString().split('T')[0];
      document.getElementById('targetDate').value = formattedDate;
    }

    function addTaskInputRow() {
      taskCount++;
      const container = document.getElementById('taskInputContainer');
      const row = document.createElement('div');
      row.className = 'task-input-item';
      row.id = `task-row-${taskCount}`;
      row.innerHTML = `
        <div class="task-input-row">
          <input type="text" class="task-input-text" placeholder="Enter task (e.g., Revise Chapter 3)...">
          <button class="btn-icon" onclick="removeTaskInputRow(${taskCount})">✕</button>
        </div>
        <div class="task-time-row">
          <span>Custom Notification Time (Optional):</span>
          <input type="time" class="task-input-time" placeholder="Use global">
        </div>
      `;
      container.appendChild(row);
    }

    function removeTaskInputRow(id) {
      const container = document.getElementById('taskInputContainer');
      if (container.children.length > 1) {
        const row = document.getElementById(`task-row-${id}`);
        if (row) row.remove();
      }
    }

    function saveChecklist() {
      const dateVal = document.getElementById('targetDate').value;
      const globalTimeVal = document.getElementById('globalTime').value || '10:30';
      const taskItems = document.querySelectorAll('.task-input-item');

      if (!dateVal) {
        alert("Please select a date.");
        return;
      }

      let newTasks = [];
      taskItems.forEach(item => {
        const text = item.querySelector('.task-input-text').value.trim();
        const customTime = item.querySelector('.task-input-time').value;
        if (text !== '') {
          newTasks.push({
            id: Date.now() + Math.random(),
            text: text,
            time: customTime ? customTime : globalTimeVal,
            completed: false
          });
        }
      });

      if (newTasks.length === 0) {
        alert("Please enter at least one task.");
        return;
      }

      let store = JSON.parse(localStorage.getItem('study_checkpoints')) || {};
      if (!store[dateVal]) {
        store[dateVal] = [];
      }

      store[dateVal] = store[dateVal].concat(newTasks);
      localStorage.setItem('study_checkpoints', JSON.stringify(store));

      // Reset Inputs
      document.getElementById('taskInputContainer').innerHTML = '';
      taskCount = 0;
      addTaskInputRow();

      loadChecklists();
      alert("Checklist saved successfully!");
    }

    function loadChecklists() {
      const container = document.getElementById('checklistsContainer');
      const store = JSON.parse(localStorage.getItem('study_checkpoints')) || {};
      const dates = Object.keys(store).sort();

      if (dates.length === 0) {
        container.innerHTML = `<div class="card empty-state">No checkpoints created yet. Add one above!</div>`;
        return;
      }

      container.innerHTML = '';

      dates.forEach(date => {
        const dateGroup = document.createElement('div');
        dateGroup.className = 'date-group';

        const dateHeader = document.createElement('div');
        dateHeader.className = 'date-header';
        dateHeader.innerHTML = `
          <span>📅 ${formatDisplayDate(date)}</span>
          <button class="btn-icon" style="font-size: 0.8rem; color: var(--danger);" onclick="deleteDateGroup('${date}')">Delete Day</button>
        `;
        dateGroup.appendChild(dateHeader);

        store[date].forEach(task => {
          const taskCard = document.createElement('div');
          taskCard.className = `task-card ${task.completed ? 'completed' : ''}`;
          taskCard.innerHTML = `
            <input type="checkbox" class="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask('${date}', ${task.id})">
            <div class="task-info">
              <div class="task-text">${escapeHtml(task.text)}</div>
              <div class="task-time-tag">⏰ Reminder: ${task.time}</div>
            </div>
            <button class="btn-icon" onclick="deleteSingleTask('${date}', ${task.id})">✕</button>
          `;
          dateGroup.appendChild(taskCard);
        });

        container.appendChild(dateGroup);
      });
    }

    function toggleTask(date, taskId) {
      let store = JSON.parse(localStorage.getItem('study_checkpoints')) || {};
      if (store[date]) {
        store[date] = store[date].map(t => {
          if (t.id === taskId) t.completed = !t.completed;
          return t;
        });
        localStorage.setItem('study_checkpoints', JSON.stringify(store));
        loadChecklists();
      }
    }

    function deleteSingleTask(date, taskId) {
      let store = JSON.parse(localStorage.getItem('study_checkpoints')) || {};
      if (store[date]) {
        store[date] = store[date].filter(t => t.id !== taskId);
        if (store[date].length === 0) delete store[date];
        localStorage.setItem('study_checkpoints', JSON.stringify(store));
        loadChecklists();
      }
    }

    function deleteDateGroup(date) {
      if (confirm(`Delete all tasks for ${date}?`)) {
        let store = JSON.parse(localStorage.getItem('study_checkpoints')) || {};
        delete store[date];
        localStorage.setItem('study_checkpoints', JSON.stringify(store));
        loadChecklists();
      }
    }

    function formatDisplayDate(dateStr) {
      const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString(undefined, options);
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // Push Notifications Logic
    function requestNotificationPermission() {
      if ("Notification" in window && Notification.permission !== "granted") {
        Notification.requestPermission();
      }
    }

    function checkDailyReminders() {
      setInterval(() => {
        const todayStr = new Date().toISOString().split('T')[0];
        const now = new Date();
        const currentTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        let store = JSON.parse(localStorage.getItem('study_checkpoints')) || {};
        if (store[todayStr]) {
          store[todayStr].forEach(task => {
            if (!task.completed && task.time === currentTimeStr && !task.notified) {
              triggerNotification(task.text);
              task.notified = true;
              localStorage.setItem('study_checkpoints', JSON.stringify(store));
            }
          });
        }
      }, 30000); // Check every 30 seconds
    }

    function triggerNotification(taskText) {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("Study Checkpoint Reminder", {
          body: `Task scheduled for right now: ${taskText}`,
          icon: "https://cdn-icons-png.flaticon.com/512/3209/3209265.png"
        });
      }
    }
  </script>
</body>
</html>
